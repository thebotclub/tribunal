name: secrets-readonly
version: 1
description: >
  Block AI agents from writing, editing, or deleting anything that looks
  like a secret — .env files, secret stores, private keys, certs.
  Reads are still allowed (you'll see them in the audit log).

rules:
  - id: secrets/no-env-write
    when:
      event_type: [file.write, file.delete]
      path_match:
        - "**/.env"
        - "**/.env.*"
        - "**/.envrc"
    action: deny
    message: |
      Writing or deleting .env files via an AI agent is blocked by the
      secrets-readonly policy. Use 1Password / Doppler / GCP Secret
      Manager and inject at runtime.

  - id: secrets/no-private-key-write
    when:
      event_type: [file.write, file.delete]
      path_match:
        - "**/*.pem"
        - "**/*.key"
        - "**/id_rsa"
        - "**/id_ed25519"
        - "**/*.p12"
        - "**/*.pfx"
    action: deny
    message: Blocked write to private key material.

  - id: secrets/no-credential-file-write
    when:
      event_type: file.write
      path_match:
        - "**/credentials"
        - "**/credentials.json"
        - "**/credentials.yaml"
        - "**/.aws/credentials"
        - "**/.gcp/service-account*.json"
        - "**/firebase-adminsdk*.json"
    action: deny
    message: Blocked write to cloud-credential file.

  - id: secrets/warn-secret-folder-read
    when:
      event_type: file.read
      path_match:
        - "**/secrets/**"
        - "**/.secrets/**"
    action: warn
    message: |
      Reading from a secrets folder. The audit log will record which
      files the agent touched.
