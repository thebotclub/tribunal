name: New agent adapter
description: Ask for (or volunteer to build) a Tribunal adapter for a new coding agent
labels: [adapter, good first issue]
body:
  - type: input
    id: agent
    attributes:
      label: Which agent?
      placeholder: Aider / Continue / Sweep / ...
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link to the agent's docs or GitHub
    validations:
      required: true

  - type: textarea
    id: hook-surface
    attributes:
      label: Hook surface
      description: Where can the agent be intercepted? Config file? Hook API? Shell wrapper? Proxy?
    validations:
      required: true

  - type: dropdown
    id: volunteer
    attributes:
      label: Are you up for writing the adapter?
      options:
        - Yes, I will open a PR
        - I need help, please pair with me
        - I am just requesting it
    validations:
      required: true
